[project]
name = "my-agent"
version = "0.1.0"
description = "Sample Agent Server application for the self-hosted training guide"
readme = "README.md"
authors = [
    { name = "haithamshahin333", email = "42976403+haithamshahin333@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.0,<2.0",
    # Used by the perf graph (module 10). All three ship in the langgraph-api image; declared so the
    # imports are explicit and version-bounded.
    "langgraph-sdk>=0.4.4,<1.0",      # ServerRuntime, the factory's second argument
    "prometheus-client>=0.20,<1.0",   # histograms on the server's own GET /metrics registry
    "structlog>=24,<26",              # JSON log lines through the server's configured pipeline
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=9.1.1",
]
