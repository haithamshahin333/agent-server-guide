[project]
name = "my-agent"
version = "0.1.0"
description = "Sample Agent Server application for the self-hosted training guide"
readme = "README.md"
authors = [
    { name = "haithamshahin333", email = "42976403+haithamshahin333@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "langgraph-sdk>=0.4.4",
    "pytest>=9.1.1",
]
