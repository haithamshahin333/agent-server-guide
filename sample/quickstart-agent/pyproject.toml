[project]
name = "quickstart-agent"
version = "0.1.0"
description = "Quickstart: a Deep Agent served by the Agent Server"
readme = "README.md"
authors = [
    { name = "haithamshahin333", email = "42976403+haithamshahin333@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7",
    "langchain-openai>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickstart_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
]
